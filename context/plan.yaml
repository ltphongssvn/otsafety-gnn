# context/plan.yaml
# THE PLAN AS INTENT, validated by project-plan/v1 (contracts/plan.py).
#
# It declares what is to be done, the loop each step serves, and the evidence
# that proves each step done. It NEVER records status: every status written into
# a plan by hand drifted from the work it described. `plan:status` observes the
# evidence and derives status, progress and the current position. Edit this file
# only when the plan itself changes, and in the same commit as the work.
contract: project-plan/v1
threads:
  - {id: A, title: Research definition}
  - {id: B, title: Engineering platform}
  - {id: C, title: 'Deliverables: the site and the sheet'}
  - {id: D, title: Experiment tracking}
  - {id: E, title: The GNN package}
  - {id: F, title: 'Release, deployment and supply chain'}
  - {id: G, title: 'Contracts, policy and evidence'}
phases:
  - {id: '0', title: Ground truth}
  - {id: '1', title: Branch divergence}
  - {id: '2', title: GitFlow baseline}
  - {id: '3', title: Worktree}
  - {id: '4', title: Stack inventory}
  - {id: '6', title: Toolchain and tasks}
  - {id: '7', title: The site}
  - {id: '8', title: The PDF}
  - {id: 8F, title: 'Release, deployment and supply chain'}
  - {id: 8G, title: 'Contracts, policy and evidence'}
  - {id: '9', title: The GNN package}
  - {id: '10', title: Lightning AI}
  - {id: '11', title: Research execution}
loops:
  - {id: declare, code: infrastructure and configuration, data: inventory and actual state}
  - {id: constrain, code: policy, data: verdicts with reasons}
  - {id: produce, code: 'pipelines, schemas and quality checks', data: 'lineage, quality results and metrics'}
  - {id: promise, code: contracts and SLOs, data: evidence}
  - {id: instrument, code: observability and alerts, data: telemetry and incidents}
steps:
  - id: '0.1'
    title: Every repository and worktree located
    thread: B
    phase: '0'
    depends_on: []
    because: {}
    serves:
      - {loop: declare, side: data}
    done_when:
      - {kind: task, name: 'worktree:list'}
  - id: '0.2'
    title: Remotes, default branch and develop recorded
    thread: B
    phase: '0'
    depends_on: []
    because: {}
    serves:
      - {loop: declare, side: data}
    done_when:
      - {kind: task, name: 'repo:check'}
  - id: '0.3'
    title: Per-branch ahead and behind, after fetch --prune
    thread: B
    phase: '0'
    depends_on: []
    because: {}
    serves:
