    reason: 'Superseded by G.82. This existed to carry debt G.73 created by asking every edge to justify itself -- a rule
      that is over-broad, since 2.2 waits on 2.1 because a pull request needs GitFlow, and unsatisfiable, since source is
      one field per step while 11.1 waits on nine. G.82 narrows the rule to edges that CROSS threads, which is where the one
      real defect lived, and puts the reason on the edge. All seventy-two crossing edges now carry one, so there is no backlog
      left to work down.', source: SESSION}
