      builds either side -- an evidence gap, which 2026 audit practice flags exactly as a missing control
    because: {'8.5': the rule judges a rendered deliverable}
    serves:
      - {loop: promise, side: data}
      - {loop: constrain, side: code}
    done_when:
      - {kind: path, path: tooling/tests/test_every_stage_names_its_steps.py}
  - id: G.80
    title: The blind set names evidence kinds as the contract spells them, proved against the contract itself
    thread: G
    phase: 8G
    depends_on: [G.48]
    source: BLIND_AT_THE_INDEX holds tag while ReleaseEvidence.kind is release, so the sets never intersect and every release-tag
      step has read unmet since G.48 landed -- F.4 and F.5 are done, their tags cut, and the plan has been reporting them
      blocked
    because: {}
    serves:
      - {loop: constrain, side: code}
    done_when:
      - {kind: path, path: tooling/tests/test_blind_kinds_match_the_contract.py}
  - id: G.81
    title: 'A record is replaced atomically or not at all: no writer truncates a file in place'
    thread: G
    phase: 8G
    depends_on: [G.44, G.3]
    source: twenty-five call sites write with Path.write_text, which truncates then writes, so an interruption leaves the
      plan, the ledger, the trace or the matrix neither the old file nor the new one -- and this repository's writers run
      unattended, where nobody is watching to notice a half-written record
    because: {}
    serves:
      - {loop: constrain, side: code}
    done_when:
      - {kind: path, path: tooling/tests/test_records_are_replaced_atomically.py}
  - id: G.82
    title: A cross-thread dependency carries its own reason, on the edge rather than the step
    thread: G
    phase: 8G
    depends_on: [G.73]
    source: 'G.73 asked every step that waits on another to say why, which is over-broad: 2.2 waits on 2.1 because pull requests
      need GitFlow, and demanding a sentence for that buries the one edge that mattered -- 2026 practice reserves justification
      for what affects structure or is hard to reverse, and skips the obvious. It is also unsatisfiable as written: source
      is one field per step, so 11.1 with nine cross-thread dependencies can record one sentence for all of them'
    because: {}
    serves:
      - {loop: constrain, side: data}
    done_when:
      - {kind: path, path: tooling/tests/test_a_crossing_edge_says_why.py}
  - id: G.83
    title: A proof is observed failing against a mutant, or it does not count
    thread: G
    phase: 8G
    depends_on: [G.77]
    source: 'every gate accepting a test here measures quantity and none measures whether the test CAN fail: the five assertions
      written for 7.2 were all true negatives and passed identically against a rule examining nothing, and a proof chosen
      by name-matching -- which failed four times, at G.63, G.79, 7.2 and G.34 -- survives mutation of the thing it claims
      to guard, so one harness catches both -- BLOCKED UPSTREAM: mutmut 3.8 resolves its source directory as ./, src/ or source/
      alone, and this uv workspace keeps the package at tooling/src, so every mutant is reported as covered by no test; the
      configuration here is complete and waits on the tool'
    because: {G.77: the proof kind is what this mutates; without a named test there is nothing to run}
    serves:
      - {loop: constrain, side: code}
    done_when:
      - {kind: path, path: mutants/mutmut-cicd-stats.json}
  - id: G.84
    title: History is read as records through one reader, and a commit body cannot forge one
    thread: G
    phase: 8G
    depends_on: [G.29]
    source: 'reading history was the one operation with no task, so every question about what this repository had already
      solved was answered with a raw git log and a grep -- run differently each time and recorded nowhere. Building it found
      a live defect: commits_since_cutoff framed its records with the ASCII record separator, which a commit body may contain,
      and that function decides whether every commit names a plan step'
    because: {G.29: the trailer rule is what reads the history this framing protects}
    serves:
      - {loop: constrain, side: code}
    done_when:
      - {kind: task, name: 'history:log'}
      - {kind: proof, test: 'tooling/tests/test_history_cannot_be_forged.py::test_a_body_holding_the_record_separator_forges_nothing'}
  - id: G.85
    title: The SLSA Source Level is computed from evidence and enforced by policy
    thread: G
    phase: 8G
    depends_on: [E.37, G.5, '6.5']
    source: 'SLSA v1.2 approved the Source Track in November 2025, and its requirement is explicit: an attestation MUST state
      the level of any revision at L1 or above, so a repository claiming a level without one claims nothing checkable. This
      repository already meets much of L2 and L3 -- history rewriting banned, branch protection and required checks as data
      -- and says so nowhere a consumer could verify. L4 needs two reviewers and is honestly out of reach for one maintainer,
      which the attestation must state rather than quietly omit -- the title first said ''and attested'', which its acceptance
      criteria never tested: a task, a Rego rule and a test cannot observe a signature. Attestation, verification and the
      audit trail are their own step'
    because: {E.37: the envelope and statement shapes an attestation is written in are declared there, G.5: 'the rule judges
        the evidence, and the policy engine is what runs it', '6.5': branch protection as data is the evidence a control was
        enforced}
    serves:
      - {loop: constrain, side: data}
    done_when:
      - {kind: task, name: 'slsa:source'}
      - {kind: path, path: policy/slsa.rego}
      - {kind: proof, test: 'tooling/tests/test_the_source_level_is_attested.py::test_a_level_is_computed_not_claimed'}
  - id: G.86
    title: A decision is signed, verified from its signature, and the trail is queryable
    thread: G
    phase: 8G
    depends_on: [G.85, E.37]
    source: the Source Level is measured, recorded and enforced, and nothing signs the record. A predicate document without
      a signature is a file anyone could have written, which is what E.37 established the envelope shapes for; nothing reads
      one back, so a tampered record is indistinguishable from an honest one; and the append-only trail accumulates with no
      way to ask what it holds, which is a drawer rather than an audit
    because: {G.85: 'the decision record this signs is written there, and judged by its policy', E.37: the envelope and statement
        shapes a signature is carried in are declared there}
    serves:
      - {loop: constrain, side: data}
    done_when:
      - {kind: task, name: 'slsa:verify'}
  - id: G.87
    title: Whether the evidence establishes the claim is reviewed, recorded, and never gated
    thread: G
    phase: 8G
    depends_on: [G.85, G.47]
    source: 'the vocabulary rule answers whether a title''s words have evidence of a compatible KIND; it cannot answer whether
      that evidence establishes what the sentence claims. That needs a reader. It must not be a gate: non-determinism in a
      language model persists even under greedy decoding, originating before the sampling step, so a judge that flips once
      makes a gate that blocks the same change twice -- and a gate''s whole value is that its answer can be reproduced'
    because: {G.85: 'the vocabulary rule is the deterministic floor this runs behind, on what it passed', G.47: 'no gate reaches
        the network, which is why this produces evidence rather than a verdict'}
    serves:
      - {loop: constrain, side: data}
    done_when:
      - {kind: task, name: 'plan:review'}
      - {kind: path, path: tooling/src/otsafety_tooling/contracts/semantic_review.py}
  - id: G.88
    title: A change to several files is validated whole and published together, or not at all
    thread: G
    phase: 8G
    depends_on: [G.81, G.3]
    source: 'every multi-file change this session went through an unreviewed script in /tmp that edited and wrote each file
      in turn, validating whatever was remembered that time: one parsed the TOML it changed and wrote the workflow YAML unchecked,
      though a contract for workflows existed. A refusal on the last file would have left the first ones written, describing
      a task no step claimed. Each file was atomic; the change was not'
    because: {G.81: a single record is already replaced atomically; this composes those into one change, G.3: each candidate
        is validated through its contract by the sanctioned parsers}
    serves:
      - {loop: constrain, side: code}
    done_when:
      - {kind: path, path: tooling/src/otsafety_tooling/changeset.py}
      - {kind: proof, test: 'tooling/tests/test_a_change_commits_whole.py::test_one_invalid_file_writes_nothing'}
