# context/exemptions.yaml
# Every exemption from a lint or type rule, with its reason. Checked both ways by
# policy:exemptions in the pre-commit hook and by test_exemptions.py in CI: a
# suppression with no entry fails, and so does an entry whose suppression is gone.
contract: exemption-register/v1
scoped:
- glob: apps/site/tests/**
  rules:
  - S101
  - S603
  - S607
  - S310
  - BLE001
  - E402
  reason: S101 is pytest's assert; S603/S607 launch the site's build and preview through bun by a fixed argument
    list; S310 opens a hard-coded localhost URL; BLE001 catches whatever a not-yet-listening socket raises while
    polling; E402 imports playwright after importorskip
- glob: scripts/**
  rules:
  - T201
  - S603
  - S310
  - S202
  reason: T201 bootstrap CLIs print what they install; S603 runs a just-installed binary's --version by fixed argument
    list; S310 downloads a URL from toolchain.json and the next line verifies its sha256; S202 extracts inside a
    temporary directory an archive whose sha256 was verified first
- glob: scripts/build_arch_onepager.py
  rules:
  - C408
  - E501
  - N806
  reason: 'style rules only, on a generator preserved verbatim: a rewrite to the house style once silently dropped
    five of the sheet''s nine sections'
- glob: tooling/tests/**
  rules:
  - S101
  - S603
  - S607
  - ANN401
  reason: S101 is pytest's assert; S603/S607 run pinned tools by fixed argument list with no shell; ANN401
    test spies and payload builders record whatever an untyped library is handed, and typing them would restate
    that library's untyped surface in the test
- glob: tooling/src/otsafety_tooling/git/*.py
  rules:
  - T201
  reason: the git package's command-line entry points print by design
inline:
- path: scripts/bootstrap_toolchain.py
  rule: TID251
  count: 1
  reason: 'standard library only: bootstrap runs before any dependency is installed'
- path: tooling/src/otsafety_tooling/artifacts.py
  rule: T201
  count: 1
  reason: 'prints the command''s output: this is a command-line entry point'
- path: tooling/src/otsafety_tooling/contracts/files.py
  rule: TID251
  count: 4
  reason: 'the sanctioned reader: the one place raw parsing happens, straight into model_validate'
