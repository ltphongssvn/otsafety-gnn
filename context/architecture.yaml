# context/architecture.yaml
# 8.5: proves this step of the plan.
contract: architecture/v1
layers:
- n: '1'
  name: REALITY
  origin: spec
  question: Does modulating target T actually cause endpoint E?
  failure: On-target biology conflated with drug pharmacology. The project asks about the first; all evidence
    is generated by the second.
  guard: -- unresolvable; declared in model card
  as_code: --
  as_data: Model-card limitation statement
  id: '1'
- n: '2'
  name: SELECTION
  origin: added
  question: Which truths ever get the chance to become evidence?
  failure: Study attention, who got dosed, indication and reporting bias. Degree bias and confounding
    by indication are BORN here -- not in the model.
  guard: audit/degree.py · data/attribution.py
  as_code: Policy as Code -- study-bias thresholds
  as_data: Degree distribution snapshot
  id: '2'
- n: '3'
  name: EVIDENCE
  origin: spec
  question: What have we actually observed?
  failure: Undated or unprovenanced edges admitted, making temporal claims unverifiable.
  guard: data/ingest.py -- quarantine at ingest
  as_code: Schema as Code -- Edge contract
  as_data: Provenance as Data -- ReleasePin hash
  id: '3'
- n: '4'
  name: ATTRIBUTION
  origin: added
  question: Drug-level observation to target-level claim. Which target did it?
  failure: Uniform propagation makes the LABEL a function of target degree -- re-importing the exact confound
    removed at layer 8.
  guard: data/attribution.py -- noisy-OR + Mantel-Haenszel
  as_code: Transformation as Code
  as_data: Evidence as Data -- q vector, leak, crude/adj
  id: '4'
- n: '5'
  name: LABELING RULE
  origin: spec
  question: How do we interpret the evidence?
  failure: Unlabelled silently treated as negative; evidence tiers pooled so the label's meaning cannot
    be stated.
  guard: data/labels.py -- 3 states, tiers never pooled
  as_code: Policy as Code -- tier + earned-negative rules
  as_data: Decisions as Data -- per-target tier
  id: '5'
- n: '6'
  name: DATASET LABEL
  origin: spec
  question: positive / earned-negative / unlabelled, per tier
  failure: Multiaxiality corrupts the label matrix; a PT annotation becomes a false negative at ancestor
    level.
  guard: data/ontology.py · models/hierarchy.py
  as_code: Contract as Code -- SafetyLabel + DAG
  as_data: Contracts as Data -- versioned label set
  id: '6'
- n: '7'
  name: SPLIT
  origin: added
  question: Which labels does the model SEE vs get TESTED on?
  failure: Interpolation split behind an extrapolation claim. Same labels + different split = a different
    scientific claim.
  guard: data/splits.py · audit/leakage.py (DL1/2/3)
  as_code: Acceptance Criteria as Code -- cutoff
  as_data: Verdict as Data -- pass/fail + reason
  id: '7'
- n: '8'
  name: MODEL
  origin: spec
  question: What can the GNN learn from it?
  failure: A popularity detector with an excellent AUROC. Degree explains the score; biology does not.
  guard: models/hetero_gnn.py -- degree offset, partial rho
  as_code: Model Config as Code -- conf/model/*.yaml
  as_data: Metrics as Data -- per-seed, decile, level
  id: '8'
- n: '9'
  name: VERDICT
  origin: added
  question: Promote or reject? At what operating point, on what evidence?
  failure: A score shipped where a decision was required; no bound on what the model misses.
  guard: eval/metrics.py · pipeline.py -- conformal + card
  as_code: SLO as Code -- min_ap_lift, min_partial_rho
  as_data: Attestation as Data -- signed model card
  id: '9'
stages:
- title: CONFIGURATION
  source: conf/config.yaml + pinned OT release hash
  as_code: Configuration as Code
  as_data: Config as Data
  id: '0'
- title: VALIDATED CONTRACT
  source: Pydantic v2 · Edge, SafetyLabel, Split
  as_code: Schema as Code
  as_data: Contracts as Data
  id: '1'
- title: AUDIT GATE
  source: leakage DL1/2/3 · degree null · neg-controls
  as_code: Policy as Code
  as_data: Verdict as Data
  gate: HALT
  id: '2'
- title: MODEL FACTORY
  source: GBM | ComplEx | SAGE/GAT | R-GCN/HGT
  as_code: Model Config as Code
  as_data: Lineage as Data
  id: '3'
- title: TRAINING · 5 SEEDS
  source: identical split, negatives, endpoints
  as_code: Pipeline as Code
  as_data: Metrics as Data
  id: '4'
- title: PROMOTION GATE
  source: OPA/Rego · Δ(rung 5 − rung 4)
  as_code: SLO as Code
  as_data: Decision as Data
  gate: REJECT
  id: '5'
- title: SIGNED MODEL CARD
  source: promote / reject + evidence chain
  as_code: Governance as Code
  as_data: Attestation as Data
  id: '6'
questions:
- id: Q1
  title: Is there any signal beyond node popularity?
  contrast: GNN vs degree-only null (LogisticRegression on log-degree, no biology, no relations)
  if_it_ties: The KG encodes study attention, not safety biology. The project returns a negative result
    -- and that is a real finding.
- id: Q2
  title: Does the graph help beyond non-graph target features?
  contrast: GNN vs tabular GBM / MLP on target annotations only (GTEx expression breadth, gnomAD pLI &
    LOEUF, protein family, subcellular localisation)
  if_it_ties: Graph structure adds nothing. Ship the cheaper tabular model and close the project.
- id: Q3
  title: Do the relation TYPES carry the signal?
  contrast: Relation-aware (R-GCN, CompGCN, HGT) vs relation-agnostic (GraphSAGE, GAT on a collapsed single
    adjacency)
  if_it_ties: Connectivity matters; relationships per se do not. Q3 is the literal research question in
    the brief -- if a relation-agnostic GNN matches a relation-aware one, the answer to "can relationships
    be used to predict" is no, only connectivity can.
rungs:
- name: No-graph control
  question: Q2
  detail: sklearn HistGradientBoostingClassifier + tabular MLP -- target annotations only
  id: No-graph control
- name: Degree-only null
  question: Q1
  detail: sklearn LogisticRegression on log1p(per-relation degree)
  id: Degree-only null
- name: Graph-topology GBM
  question: Q1
  detail: sklearn HistGradientBoostingClassifier on PPR / betweenness / k-core / clustering
  id: Graph-topology GBM
- name: Shallow KGE
  question: Q3
  detail: PyKEEN ComplEx, PyKEEN RotatE -- relation-typed, no message passing
  id: Shallow KGE
- name: Relation-agnostic GNN
  question: Q3
  detail: PyG GraphSAGE (SAGEConv), PyG GAT (GATConv) on data.to_homogeneous()
  id: Relation-agnostic GNN
- name: Relation-aware GNN
  question: Q3
  detail: PyG R-GCN (RGCNConv), CompGCN, PyG HGT (HGTConv) + degree-offset head
  id: Relation-aware GNN
scope_in:
- Public, open-source KGs only. Open Targets is primary -- it carries the target-safety widget (ToxCast,
  AOPWiki, ClinPGx).
- Hetionet / PrimeKG as secondary graphs, for cross-KG replication of whatever result Open Targets gives.
- AstraZeneca BIKG is the architectural reference only -- it is internal and is not usable as data.
scope_out:
- Molecular structure prediction
- Compound-level toxicity from chemistry
- Clinical decision support
- Anything requiring non-public data
