questions:
- id: Q1
  title: Is there any signal beyond node popularity?
  contrast: GNN vs degree-only null (LogisticRegression on log-degree, no biology, no relations)
  if_it_ties: The KG encodes study attention, not safety biology. The project returns a negative result
    -- and that is a real finding.
- id: Q2
  title: Does the graph help beyond non-graph target features?
  contrast: GNN vs tabular GBM / MLP on target annotations only (GTEx expression breadth, gnomAD pLI &
    LOEUF, protein family, subcellular localisation)
  if_it_ties: Graph structure adds nothing. Ship the cheaper tabular model and close the project.
- id: Q3
  title: Do the relation TYPES carry the signal?
  contrast: Relation-aware (R-GCN, CompGCN, HGT) vs relation-agnostic (GraphSAGE, GAT on a collapsed single
    adjacency)
  if_it_ties: Connectivity matters; relationships per se do not. Q3 is the literal research question in
    the brief -- if a relation-agnostic GNN matches a relation-aware one, the answer to "can relationships
    be used to predict" is no, only connectivity can.
rungs:
- id: Base rate
  n: '0'
  name: Base rate
  experiment: prevalence
  asks: What does guessing the prior achieve?
  models: A prevalence constant, equivalent to sklearn DummyClassifier(strategy="prior")
  answers: none
  if_not_beaten: Anchors average precision. Anything not beating it is noise.
- id: Degree-only null
  n: '1'
  name: Degree-only null
  experiment: degree-null
  asks: Does simple popularity explain performance?
  models: sklearn LogisticRegression on log1p(per-relation degree). No biology, no relations, no message
    passing.
  answers: Q1
  if_not_beaten: The graph encodes study attention, not safety biology. The project returns a negative
    result, and that is a real finding.
- id: Non-graph model
  n: '2'
  name: Non-graph model
  experiment: tabular
  asks: Do target features alone explain performance?
  models: 'sklearn HistGradientBoostingClassifier and a tabular MLP on target annotations only: GTEx expression
    breadth, gnomAD pLI and LOEUF, protein family, subcellular localisation. Zero graph structure.'
  answers: Q2
  if_not_beaten: The graph adds nothing. Ship the cheaper tabular model and close the project.
- id: Graph-topology GBM
  n: 2b
  name: Graph-topology GBM
  experiment: topology-gbm
  asks: Do hand-computed graph statistics suffice?
  models: sklearn HistGradientBoostingClassifier on personalised PageRank to known-risky targets, betweenness,
    k-core, clustering, degree. Graph-derived, but no learned representation.
  answers: Q2
  if_not_beaten: A published comparator of this family reached ROC-AUC around 0.71 on target-level safety
    attrition. That is the bar a GNN must clear.
- id: Shallow KGE
  n: '3'
  name: Shallow KGE
  experiment: shallow-kge
  asks: Does embedding entities suffice, without message passing?
  models: 'PyKEEN ComplEx and PyKEEN RotatE: relation-typed scoring functions with no neighbourhood aggregation.'
  answers: Q3
  if_not_beaten: Relation-typed embedding is what helps; aggregation is not.
- id: Relation-agnostic GNN
  n: '4'
  name: Relation-agnostic GNN
  experiment: relation-agnostic
  asks: Does connectivity alone help?
  models: PyG GraphSAGE (SAGEConv) and PyG GAT (GATConv) over a collapsed single adjacency, with edge
    types deliberately discarded.
  answers: Q3
  if_not_beaten: The control that isolates relation types. Without it, no claim about relationships can
    be made at all.
- id: Relation-aware GNN
  n: '5'
  name: Relation-aware GNN
  experiment: relation-aware
  asks: Do relation TYPES add information?
  models: PyG R-GCN (RGCNConv), CompGCN and PyG HGT (HGTConv), with a degree-offset head and a gradient-reversal
    adversary.
  answers: Q3
  if_not_beaten: The difference between this rung and rung 4 IS the research answer. If it is near zero,
    connectivity matters and relation types do not.
scope_in:
- Public, open-source KGs only. Open Targets is primary -- it carries the target-safety widget (ToxCast,
  AOPWiki, ClinPGx).
- Hetionet / PrimeKG as secondary graphs, for cross-KG replication of whatever result Open Targets gives.
- AstraZeneca BIKG is the architectural reference only -- it is internal and is not usable as data.
scope_out:
- Molecular structure prediction
- Compound-level toxicity from chemistry
- Clinical decision support
- Anything requiring non-public data
ladder_rule:
  id: ladder
  rule: Every rung runs on the same split, the same negatives, the same endpoints, and at least five seeds
    with bootstrap confidence intervals. One seed cannot resolve a 0.02 difference in average precision,
    and most reported wins on biomedical knowledge graphs sit inside that band.
claim:
  question: Do the typed relationships in a public, open-source biomedical knowledge graph carry information
    that predicts drug-safety endpoints for protein targets -- over and above what is predictable from
    the graph's bare connectivity statistics, and from target-level features that require no graph at
    all?
  goal: Establish, under a leakage- and confound-controlled protocol, whether relation-aware graph learning
    over a public biomedical KG yields a usable target-safety prioritisation signal -- and quantify how
    much of any observed performance is attributable to the relationships, as opposed to node popularity
    or non-graph target biology. The deliverable is a defensible answer plus its evidence, in either direction.
  objective: 'Let the KG be a heterogeneous graph G = (V, E, R) with typed nodes and typed edges. Let
    T be the protein targets and S the safety endpoints (organ classes / adverse-event terms).Task: learn
    f : T x S -> [0,1], the probability that modulating target t is associated with endpoint s.This is
    multi-label prediction over the target x endpoint slice, not binary "is this target risky". The brief
    says endpoints -- plural -- and organ-class structure is the clinically meaningful unit; a single
    collapsed risky/not-risky label answers a different question.Evaluation: held-out target-endpoint
    pairs under a temporal split (train on the graph as of cutoff tau, predict associations that became
    knowable after tau), plus a target-disjoint cold-start split.'
  data_note: 'DATA -- Open Targets 26.03, open Parquet: target (safety nested inside), drug_warning (Tier
    1 labels), evidence_clinical_precedence (earns a negative), drug_mechanism_of_action, openfda_significant_adverse_drug_reactions
    (Tier 3). Hetionet / PrimeKG for replication. Endpoint DAG from EFO / MONDO / HPO; MedDRA is licensed
    and not redistributed.'
  scope_note: The brief says "important biomedical endpoints, with a particular focus on drug safety".
    That phrasing requires the method to be endpoint-agnostic, so the same pipeline is run once on a non-safety
    endpoint (target-disease association) to test whether any success is method-general or safety-specific.
  emphasise:
  - relationships
  - in either direction
  - G = (V, E, R)
  - 'f : T x S -> [0,1]'
  - multi-label prediction over the target x endpoint slice
  - endpoints
