# conf/config.yaml
# THE INGESTION CONTRACT: which Open Targets release, and which datasets in it.
#
# EVERY DATASET NAME HERE WAS READ OFF THE SERVER, not remembered. Listing
# ftp.ebi.ac.uk/pub/databases/opentargets/platform/26.03/output/ returns the
# real directories. Post 25.03 the layout changed to snake_case, singular, and
# Parquet only, so the camelCase names earlier drafts carried -- mechanismOfAction,
# openfdaFaers, indication -- resolve to nothing. A name that downloads nothing
# looks exactly like a source with no rows.
#
# PARQUET, NOT GRAPHQL. Open Targets own documentation says the GraphQL API
# serves a SINGLE target, disease, drug or association, and directs systematic
# queries to the downloads. This project ingests the whole graph, which is the
# systematic case; GraphQL is for single-entity spot-checks and the provenance
# links the site renders.
#
# THE RELEASE IS PINNED. Open Targets cuts a release every three months, so an
# unpinned run is not reproducible and cannot be re-audited.

data:
  platform_version: "26.03"
  base_url: "https://ftp.ebi.ac.uk/pub/databases/opentargets/platform"
  root: /data/opentargets/26.03

  # canonical_relation: [dataset, source_column, date_column]
  relations:
    drug_targets: [drug_mechanism_of_action, actionType, null]
    drug_indicated_for: [clinical_indication, source, null]
    drug_causes_ae: [openfda_significant_adverse_drug_reactions, null, null]
    associated_with: [association_by_datasource_direct, datasourceId, null]
    interacts_with: [interaction, sourceDatabase, null]
    expressed_in: [expression, null, null]

# THE LABEL SOURCES, TIERED AND NEVER POOLED.
labels:
  # Tier 1, curated. drug_warning carries withdrawals and black-box warnings;
  # target safety itself is nested inside the target dataset, because 26.03 has
  # no top-level safety directory.
  curated: [drug_warning, target]
  # A NEGATIVE MUST BE EARNED: clinical precedence at phase 3 or above with no
  # liability recorded. Lowering this buys a bigger and useless dataset.
  clinical_precedence: evidence_clinical_precedence
  min_phase_for_negative: 3

# Non-graph target features, for the rung that asks whether the graph helps at
# all. Kept apart from relations: these are columns, not edges.
target_features:
  - target_prioritisation
  - target_essentiality
  - expression
  - mouse_phenotype

# The endpoint hierarchy is a DAG, not a tree, and is loaded from open
# ontologies. MedDRA is proprietary and its hierarchy cannot be redistributed.
endpoints:
  ontologies: [efo, mondo, hp]
  ontology_api: "https://www.ebi.ac.uk/ols4/api/ontologies"
  meddra_hierarchy: null
