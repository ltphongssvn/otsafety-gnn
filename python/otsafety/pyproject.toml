# python/otsafety/pyproject.toml
# 9.1: proves this step of the plan.
[project]
name = "otsafety"
version = "0.1.0"
description = "Target-safety prediction over a biomedical knowledge graph"
# MUST AGREE WITH .python-version, which test_the_package_is_a_workspace_member
# checks: a member resolving against a different floor is how one lockfile
# becomes two resolutions.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otsafety"]

[tool.hatch.build.targets.wheel.force-include]
# THE MARKER MUST REACH THE WHEEL, or an installed copy is untyped even though
# the source is annotated.
"src/otsafety/py.typed" = "otsafety/py.typed"
