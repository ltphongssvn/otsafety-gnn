[dependency-groups]
dev = [
    # git hooks; the PyPI wheel is lefthook's official binary
    "lefthook==2.1.14",
    # spell checker; mise run lint invokes it directly, and CI runs that task
    "typos==1.49.0",
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv]
# Must equal toolchain.json's uv version; uv refuses to run otherwise.
required-version = "==0.12.7"
# Never an unmanaged interpreter (course, Homebrew or Nix Python).
python-preference = "only-managed"
# Lock for, and require wheels on, exactly the laptop and the cluster.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["tooling"]

# RUFF FOR EVERY PYTHON FILE OUTSIDE THE TOOLING PACKAGE. Without this section
# apps/site/tests resolved against no configuration at all: ruff ran with its
# default rules, so the bandit checks the tooling package selects deliberately
# were simply off, and the noqa directives written for them were reported as
# unused. Deleting those directives would have silenced the message and left the
# site tests held to a weaker standard than the rest of the repository. The
# selection matches tooling/pyproject.toml so one bar applies everywhere.
# MYPY FOR EVERY PYTHON FILE OUTSIDE THE TOOLING PACKAGE. The playwright
# override lives in tooling/pyproject.toml, which apps/site/tests does not
# resolve against, so the laptop passed only because the e2e extra was installed
# there and CI failed on an unresolved import. Same shape as the ruff gap above:
# a configuration that exists in one package and nowhere else.
#
# PLAYWRIGHT IS OPTIONAL BY DESIGN. mise run test is the fast gate and installs
# none of it; mise run test:e2e is the browser one. The test module skips when
# the extra is absent, and this is that statement for the type checker.
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# pypdf JOINS THEM FOR THE SAME REASON. It lives in the e2e extra, which the
# tooling workflow does not install, so mypy resolved it on this laptop and not
# on a runner. Third time this exact gap has appeared: an optional dependency
# imported inside a function still needs saying so to the type checker.
module = ["playwright.*", "pytest_playwright.*", "pypdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# THE ONE-PAGER GENERATOR IS PRESERVED VERBATIM. Its STAGES entries mix str and
# None for the gate badge, so mypy infers dict[str, object] and refuses to index
# them. Annotating the tables would mean editing the file, which is what already
# cost the sheet five of its nine sections once. The script is a document
# generator with no callers, it asserts its own page count, and the rendered pdf
# is checked by tests, so the narrower guarantee is the right trade here.
module = ["build_arch_onepager"]
disable_error_code = ["index"]

[tool.ruff]
line-length = 100
# DECLARED, NOT INFERRED. Ruff infers its target from requires-python beside its
# configuration, and this virtual workspace root has none, so it fell back to 3.9
# and moved tomllib out of the standard library. test_python_version.py fails
# if this ever disagrees with .python-version or tooling's requires-python.
target-version = "py313"
# FIRST-PARTY SOURCES, DECLARED. Ruff defaults to its configuration's directory and
# a src/ beneath it, and it does not read uv workspace members, so from here it took
# otsafety_tooling for third-party. This is the union of the two old defaults, and
# test_python_version.py fails if a workspace member is ever missing from it.
src = [".", "tooling", "tooling/src"]

[tool.ruff.format]
# THE FORMATTER IS NOT CONFIGURABLE PER FILE, only excludable. This generator is
# preserved verbatim: reformatting it expands 583 lines to roughly 740, breaking
# every dict(...) row across eight lines and re-wrapping the SVG f-strings. That
# is the same class of editing that already cost the sheet five of its nine
# sections once. ruff check still runs on it, with only the style rules ignored
# in per-file-ignores above, so a real defect is still caught.
exclude = ["scripts/build_arch_onepager.py"]

[tool.ruff.lint]
# RUF100 FAILS A SUPPRESSION THAT SUPPRESSES NOTHING, so none can linger as noise.
# ANN401: no bare Any in a signature. mypy's disallow_any_explicit covers the rest.
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "N", "T20", "BLE", "TID251", "RUF100", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Each entry's reason is in context/exemptions.yaml, whose scoped entries must
# equal this table exactly; policy:exemptions and test_exemptions.py check it.
"apps/site/tests/**" = ["S101", "S603", "S607", "S310", "BLE001", "E402"]
"scripts/**" = ["T201", "S603", "S310", "S202"]
"scripts/build_arch_onepager.py" = ["C408", "E501", "N806"]
"tooling/tests/**" = ["S101", "S603", "S607", "ANN401"]
"tooling/src/otsafety_tooling/git/*.py" = ["T201"]

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "bun.lock",
    ".artifacts/",
    "apps/site/dist/",
    "apps/site/node_modules/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
# RotatE is a knowledge-graph embedding model, named for the rotation it
# applies in complex space. typos reads it as "Rotate" misspelled.
RotatE = "RotatE"
# OT is Open Targets, the knowledge graph this project is built on; typos reads
# it as a transposed TO or OF. pn and pl are CSS class names on the phase chips
# in the one-pager, which is preserved verbatim and must not be edited to suit a
# spell checker.
OT = "OT"
pn = "pn"
pl = "pl"

# RELEASES, PORTED FROM FleetManagement WITH A PYTHON ENGINE. On a push to main,
# python-semantic-release reads the Conventional Commits since the last tag and
# creates the next vX.Y.Z tag and a GitHub Release. Nothing is committed back to
# main -- FleetManagement omits @semantic-release/git for the same reason -- so
# the GitHub Release is the changelog of record.
#
# DEFAULTS ARE STATED, because a default is what an upgrade changes silently.
# One is tightened: the default branch pattern is (main|master), and no master
# exists here to be matched by accident.
[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

# SCHEMA-FIRST, ENFORCED BY THE LINTER RATHER THAN BY REVIEW. A raw parse returns
# untyped data, which is how the site's hand-written types drifted from the
# contracts they read. Pydantic parses JSON itself: Model.model_validate_json.
# YAML has no Pydantic parser, so it is read in one sanctioned place that goes
# straight into model_validate. Every exemption below names its reason.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "read configuration through contracts/settings.py, the one settings model -- schema-first"
"os.getenv".msg = "read configuration through contracts/settings.py, the one settings model -- schema-first"
"json.loads".msg = "parse with Model.model_validate_json(...) -- schema-first"
"json.load".msg = "parse with Model.model_validate_json(...) -- schema-first"
"yaml.safe_load".msg = "read YAML through the sanctioned reader into a Pydantic model"
"yaml.load".msg = "read YAML through the sanctioned reader into a Pydantic model"
"tomllib.loads".msg = "read TOML through the sanctioned reader into a Pydantic model"
"tomllib.load".msg = "read TOML through the sanctioned reader into a Pydantic model"
