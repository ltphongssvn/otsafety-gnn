# .github/workflows/zizmor.yml
# 6.6: proves this step of the plan.
name: Zizmor

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # PINNED: the action is pinned by SHA, but its own version input defaults to
          # latest, so the zizmor it ran floated with the day CI ran.
          version: 1.30.1
          advanced-security: ${{ github.repository_owner == 'fastapi' }}
          annotations: ${{ github.repository_owner != 'fastapi' }}
